[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaai-alarm"
version = "0.1.0"
description = "Reference implementation for alert-budgeted clinical early warning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
all = ["torch>=2.1", "lightgbm>=4.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["eaai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
